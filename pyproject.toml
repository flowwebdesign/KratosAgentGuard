[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kratos-agent-guard"
version = "1.0.0"
description = "Independent, read-only authority and runtime identity inspector"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "flowwebdesign" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
keywords = ["attestation", "evidence", "provenance", "security"]
dependencies = [
  "cryptography>=44,<47",
  "playwright>=1.58,<2",
  "psutil>=6.1,<8",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "mypy>=1.14",
  "pytest>=8.3",
  "ruff>=0.8",
  "types-psutil>=7.0",
]

[project.urls]
Homepage = "https://github.com/flowwebdesign/KratosAgentGuard"
Issues = "https://github.com/flowwebdesign/KratosAgentGuard/issues"
Source = "https://github.com/flowwebdesign/KratosAgentGuard"

[project.scripts]
kratos-guard = "kratos_guard.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/kratos_guard"]

[tool.hatch.build.targets.wheel.force-include]
"packaging/systemd/kratos-agent-guard.service" = "kratos_guard/templates/kratos-agent-guard.service"
"packaging/windows/Register-KratosAgentGuardTask.ps1" = "kratos_guard/templates/Register-KratosAgentGuardTask.ps1"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["kratos_guard"]

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true
