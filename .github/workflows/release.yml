name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    if: github.ref_name == 'v1.0.0'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install uv
        run: python -m pip install uv==0.11.16

      - name: Sync locked dependencies
        run: uv sync --extra dev --locked

      - name: Verify tag and package version
        run: |
          test "$(uv run --frozen python -c 'import kratos_guard; print(kratos_guard.__version__)')" = "${GITHUB_REF_NAME#v}"

      - name: Run release gate
        run: |
          uv run --frozen ruff check .
          uv run --frozen mypy src
          uv run --frozen pytest -q

      - name: Build distributions
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          uv run --frozen python scripts/reproducible_build.py

      - name: Installed wheel smoke
        run: uv run --frozen python scripts/installed_wheel_smoke.py

      - name: Create checksums and SPDX SBOM
        run: uv run --frozen python scripts/release_manifest.py

      - name: Attest release artifacts
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Attest wheel SBOM
        uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-path: dist/kratos_agent_guard-1.0.0-py3-none-any.whl
          sbom-path: dist/kratos-agent-guard-1.0.0.spdx.json

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kratos-agent-guard-v1.0.0
          path: dist/*
          if-no-files-found: error

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Kratos Agent Guard v1.0.0"
