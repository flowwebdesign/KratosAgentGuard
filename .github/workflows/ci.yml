name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: windows-latest
            python: "3.12"
          - os: windows-latest
            python: "3.13"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install uv==0.11.16

      - name: Sync locked dependencies
        run: uv sync --extra dev --locked

      - name: Verify dependency lock
        run: uv lock --check

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Type check
        run: uv run --frozen mypy src

      - name: Test
        run: uv run --frozen pytest -q

      - name: Standalone CLI smoke
        run: uv run --frozen python scripts/standalone_smoke.py --require-clean-status

      - name: Build distributions
        run: uv build

      - name: Installed wheel smoke
        run: uv run --frozen python scripts/installed_wheel_smoke.py
